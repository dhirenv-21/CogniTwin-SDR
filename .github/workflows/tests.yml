name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (no GNU Radio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install "streamlit>=1.45" "plotly>=5" pandas
      # GNU Radio execution tests skip with their reason; everything else (validation,
      # agents, ACWRA, closed loop on the NumPy stand-in, dashboard UI) runs.
      - name: Run tests
        run: python -m pytest -q -rs -p no:cacheprovider
